<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Choom Jobs/System fixture (preview only)</title>
    <style>
      body { margin: 0; background: #1b1b1f; font: 12px system-ui; color: #ddd; }
      #badge { text-align: center; padding: 10px; color: #ffd97a; }
      #wrap { width: 640px; margin: 12px auto; display: flex; gap: 12px; }
      #wrap.narrow { width: 360px; }
      #sidebar { flex: 0 0 120px; }
      #main { flex: 1 1 auto; min-width: 0; background: #000; border-radius: 0 0 14px 14px; overflow: hidden; min-height: 184px; }
      #header { padding: 8px 12px; font-weight: 600; }
      #buttons { width: 640px; margin: 12px auto; display: flex; flex-wrap: wrap; gap: 6px; }
      #buttons button { border: 1px solid #555; background: #24262b; color: #eee; border-radius: 8px; padding: 4px 10px; }
      #readout, #log { width: 640px; margin: 12px auto; font: 11px ui-monospace, monospace; color: #9aa; white-space: pre-wrap; background: #101114; border-radius: 8px; padding: 8px 10px; }
    </style>
  </head>
  <body>
    <div id="badge">PREVIEW: production Jobs/System cards with synthetic fixture data only. All values labeled Fixture.</div>
    <div id="wrap">
      <div id="sidebar"></div>
      <div id="main">
        <div id="header"></div>
        <div id="card"></div>
      </div>
    </div>
    <div id="buttons"></div>
    <div id="readout"></div>
    <div id="log"></div>
    <script type="module" src="./jobs-system-fixture.ts"></script>
  </body>
</html>
